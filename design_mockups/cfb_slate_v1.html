<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCAAF Slate Mockup — Week 1 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --slate: #1f1f1f;
  --ash: #525252;
  --fog: #737373;
  --smoke: #d4d4d4;
  --mist: #e5e5e5;
  --white: #ffffff;
  --paper: #fafafa;
  --storm: #1e3a8a;
  --storm-hover: #1e40af;
  --font-serif: 'Newsreader', 'Source Serif Pro', Georgia, serif;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
body { font-family: var(--font-sans); color: var(--ink); background: var(--white); font-size: 16px; line-height: 1.6; margin: 0; }

.site-header { border-bottom: 1px solid var(--mist); background: rgba(255,255,255,0.92); padding: 0.85rem 1.5rem; }
.site-header__inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 600; color: var(--ink); }
.brand__divider { color: var(--smoke); margin: 0 0.5rem; }
.brand__role { font-family: var(--font-sans); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fog); font-weight: 500; }
.nav-sport { color: var(--slate); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
.nav-sport--active { color: var(--storm); }

.kicker { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ash); }
.kicker-storm { color: var(--storm); }

.ncaaf-page { max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
.ncaaf-page__header { padding-bottom: 0.5rem; margin-bottom: 1rem; }
.ncaaf-page__title {
  font-family: var(--font-serif); font-weight: 600;
  font-size: clamp(1.4rem, 1.8vw + 0.5rem, 1.85rem);
  letter-spacing: -0.015em; line-height: 1.1; margin: 0.3rem 0 0;
}

/* Sort control bar — sits below the title, above the first date section */
.sort-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 0.85rem 0;
  border-top: 1px solid var(--mist);
  border-bottom: 1px solid var(--mist);
  margin-bottom: 1.25rem;
  position: sticky; top: 0; background: var(--white); z-index: 20;
}
.sort-bar__count {
  font-family: var(--font-sans); font-size: 0.78rem; color: var(--ash);
  font-weight: 500;
}
.sort-bar__count strong { color: var(--slate); font-weight: 700; }
.sort-control {
  position: relative;
}
.sort-control__label {
  font-family: var(--font-sans); font-size: 0.75rem; color: var(--fog);
  margin-right: 0.45rem; font-weight: 500;
}
.sort-control__trigger {
  font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600;
  color: var(--ink); background: transparent; border: 0;
  cursor: pointer; padding: 0; letter-spacing: -0.01em;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 1px;
}
.sort-control__trigger::after {
  content: ' ▾'; font-family: var(--font-sans); font-size: 0.7em;
  color: var(--fog); vertical-align: 0.15em; margin-left: 0.15rem;
}
.sort-control__menu {
  position: absolute; top: calc(100% + 0.5rem); right: 0;
  min-width: 200px; background: var(--white);
  border: 1px solid var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  padding: 0.3rem 0; z-index: 30;
  display: none;
}
.sort-control__menu.is-open { display: block; }
.sort-control__option {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.55rem 0.9rem;
  font-family: var(--font-sans); font-size: 0.9rem; color: var(--slate);
  cursor: pointer; background: transparent; border: 0; width: 100%; text-align: left;
  transition: background 0.1s ease;
}
.sort-control__option:hover { background: var(--paper); color: var(--ink); }
.sort-control__option[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--paper); }
.sort-control__option[aria-selected="true"]::after { content: '●'; color: var(--storm); font-size: 0.75em; }
.sort-control__option-hint { font-size: 0.72rem; color: var(--fog); margin-left: 1rem; }

/* Date section + grid */
.date-section { margin-bottom: 2rem; }
.date-header { display: flex; align-items: baseline; gap: 0.65rem; padding-bottom: 0.6rem; margin-bottom: 0.85rem; border-bottom: 2px solid var(--ink); }
.date-header__title { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.date-header__count { font-family: var(--font-sans); font-size: 0.78rem; color: var(--ash); font-weight: 500; }

.cheat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.65rem; align-items: start; }

.cheat-card {
  display: flex; flex-direction: column;
  background: var(--white); border: 1px solid var(--mist);
  padding: 0.7rem 0.85rem 0.7rem;
  color: var(--ink); transition: border-color 0.15s ease;
  cursor: pointer; text-decoration: none;
}
.cheat-card:hover { border-color: var(--ink); }

.cheat-card__rule {
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.4rem; margin-bottom: 0.5rem;
}
.cheat-card__time {
  font-family: var(--font-sans); font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate);
}
.cheat-card__rule-right { display: inline-flex; align-items: center; gap: 0.35rem; min-width: 0; overflow: hidden; }
.cheat-card__location { font-family: var(--font-sans); font-size: 0.62rem; font-weight: 500; color: var(--fog); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.cheat-card__badge { font-family: var(--font-sans); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fog); padding: 0.08rem 0.4rem; border: 1px solid var(--smoke); border-radius: 2px; white-space: nowrap; }
.cheat-card__badge--dome { color: var(--slate); border-color: var(--slate); }
.cheat-card__badge--roof { color: var(--storm); border-color: var(--storm); }

.cheat-card__teams { display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.55rem; border-bottom: 1px solid var(--mist); margin-bottom: 0.6rem; }
.cheat-card__team { display: flex; align-items: center; gap: 0.35rem; flex: 1; min-width: 0; }
.cheat-card__team--right { justify-content: flex-end; }
.cheat-card__logo { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; background: var(--paper); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-size: 0.52rem; font-weight: 700; color: var(--fog); }
.cheat-card__abbr { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1; color: var(--ink); white-space: nowrap; }
.cheat-card__rank { font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; color: var(--storm); margin-right: 0.12rem; vertical-align: super; }
.cheat-card__at { font-family: var(--font-sans); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; color: var(--fog); flex-shrink: 0; }

.cheat-card__wx { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; margin-bottom: 0.45rem; }
.wx-stat { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.wx-stat__primary { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1; color: var(--ink); white-space: nowrap; }
.cheat-card__wx-detail { display: flex; justify-content: space-around; align-items: center; padding: 0.3rem 1rem 0.55rem; gap: 0.5rem; }
.wx-detail__item { display: inline-flex; align-items: center; gap: 0.3rem; font-family: var(--font-sans); font-size: 0.7rem; color: var(--fog); font-weight: 500; white-space: nowrap; }
.wx-stat__primary--cold   { color: #1e40af; }
.wx-stat__primary--hot    { color: #b91c1c; }
.wx-stat__primary--severe { color: #b91c1c; }
.wx-stat__primary--high   { color: #b45309; }
.wx-stat__primary--precip-low  { color: #15803d; }
.wx-stat__primary--precip-mid  { color: #b45309; }
.wx-stat__primary--precip-high { color: #b91c1c; }
.wx-stat__secondary { font-family: var(--font-sans); font-size: 0.68rem; color: var(--fog); font-weight: 500; line-height: 1.25; margin-top: 0.28rem; min-height: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 0.25rem; white-space: nowrap; }
.wx-stat__unit { font-family: var(--font-sans); font-size: 0.55rem; font-weight: 500; color: var(--fog); letter-spacing: 0.03em; margin-left: 0.15rem; vertical-align: 0.15em; }
.wx-stat__gust-inline { font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700; color: #b45309; margin-left: 0.3rem; vertical-align: 0.2em; letter-spacing: 0.02em; }
.wx-stat__secondary strong { color: var(--slate); font-weight: 600; }
.wx-stat__icon { width: 24px; height: 24px; flex-shrink: 0; }

.wx-stadium { width: 32px; height: 20px; flex-shrink: 0; display: inline-flex; }
.wx-stadium svg { width: 32px; height: 20px; }
.wx-stadium__bowl { fill: none; stroke: #9aa0a6; stroke-width: 1; }
.wx-stadium__endzone-fill { fill: #f1f3f5; }
.wx-stadium__endzone-line { stroke: #b8bcc0; stroke-width: 0.8; }
.wx-stadium__midline { stroke: #d4d4d4; stroke-width: 0.5; stroke-dasharray: 1.5 1; }
.wx-stadium__arrow line { stroke: #15803d; stroke-width: 2.4; stroke-linecap: round; }
.wx-stadium__arrow polygon { fill: #15803d; }
.wx-stadium--high .wx-stadium__arrow line   { stroke: #b45309; }
.wx-stadium--high .wx-stadium__arrow polygon { fill: #b45309; }
.wx-stadium--severe .wx-stadium__arrow line   { stroke: #b91c1c; }
.wx-stadium--severe .wx-stadium__arrow polygon { fill: #b91c1c; }

/* Odds row at the bottom of each card */
.cheat-card__odds {
  display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem;
  padding-top: 0.5rem; border-top: 1px solid var(--mist); margin-top: auto;
  font-family: var(--font-sans); font-size: 0.7rem; color: var(--fog);
}
.cheat-card__odds-total { font-weight: 700; color: var(--slate); font-size: 0.78rem; letter-spacing: 0.01em; }
.cheat-card__odds-open { color: var(--fog); font-size: 0.7rem; }
.cheat-card__odds-delta { font-weight: 700; font-size: 0.75rem; }
.cheat-card__odds-delta--up { color: #15803d; }
.cheat-card__odds-delta--down { color: #b91c1c; }
.cheat-card__odds--none { color: var(--fog); font-style: italic; font-size: 0.7rem; }

/* Highlight the card when it drives the sort */
.cheat-card.is-sort-highlighted {
  border-color: var(--storm); box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.08);
}

/* Mobile adjustments */
@media (max-width: 640px) {
  .ncaaf-page { padding: 1rem 1rem 3rem; }
  .cheat-row { grid-template-columns: 1fr; gap: 0.6rem; }
  .cheat-card { min-height: 0; }
  .sort-bar { flex-direction: row; gap: 0.5rem; padding: 0.7rem 0; }
  .sort-bar__count { font-size: 0.72rem; }
  .sort-control__trigger { font-size: 0.95rem; }
  .sort-control__label { display: none; }
  .cheat-card__wx { gap: 0.3rem; }
  .wx-stat__primary { font-size: 1.25rem; }
  .wx-stat__icon, .wx-stadium { width: 22px; height: 22px; }
  .wx-stadium svg { width: 28px; height: 18px; }
}
</style>
</head>

// RENDER
// ============================================================================
function stadiumIcon(deg, windClass) {
  const rotation = ((deg || 0) + 180) % 360;
  const cls = windClass === 'severe' ? 'wx-stadium wx-stadium--severe'
            : windClass === 'high' ? 'wx-stadium wx-stadium--high'
            : 'wx-stadium';
  return `<span class="${cls}" aria-hidden="true"><svg viewBox="0 0 40 24">
    <rect class="wx-stadium__endzone-fill" x="2.5" y="2.5" width="5.5" height="19"/>
    <rect class="wx-stadium__endzone-fill" x="32" y="2.5" width="5.5" height="19"/>
    <rect class="wx-stadium__bowl" x="2" y="2" width="36" height="20" rx="0.6" ry="0.6"/>
    <line class="wx-stadium__endzone-line" x1="8" y1="2" x2="8" y2="22"/>
    <line class="wx-stadium__endzone-line" x1="32" y1="2" x2="32" y2="22"/>
    <line class="wx-stadium__midline" x1="20" y1="2.5" x2="20" y2="21.5"/>
    <g class="wx-stadium__arrow" transform="rotate(${rotation} 20 12)">
      <line x1="20" y1="18" x2="20" y2="7"/>
      <polygon points="20,5 16.5,9.5 23.5,9.5"/>
    </g></svg></span>`;
}

function windCompass(deg) {
  if (deg === 0 && arguments[1] === 0) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function precipIcon(pct) {
  const color = pct >= 70 ? '%23b91c1c' : pct >= 40 ? '%23b45309' : '%2315803d';
  const name = pct >= 40 ? 'cloud-rain' : 'sun';
  return `<img class="wx-stat__icon" src="https://api.iconify.design/ph:${name}.svg?color=${color}&width=24&height=24" alt="" width="24" height="24">`;
}

function weatherIcon(forecast) {
  const f = (forecast || '').toLowerCase();
  let name = 'sun', color = '%23ca8a04';
  if (f.includes('thunder') || f.includes('storm')) { name = 'cloud-lightning'; color = '%23b45309'; }
  else if (f.includes('snow')) { name = 'cloud-snow'; color = '%231e40af'; }
  else if (f.includes('rain') || f.includes('shower')) { name = 'cloud-rain'; color = '%231e40af'; }
  else if (f.includes('cloud') || f.includes('overcast')) { name = 'cloud'; color = '%23525252'; }
  else if (f.includes('extreme heat') || f.includes('hot')) { name = 'thermometer-hot'; color = '%23b91c1c'; }
  else if (f.includes('muggy') || f.includes('humid')) { name = 'cloud-fog'; color = '%23737373'; }
  return `<img class="wx-stat__icon" src="https://api.iconify.design/ph:${name}.svg?color=${color}&width=22&height=22" alt="${forecast}" title="${forecast}" width="22" height="22">`;
}

function renderOdds(g) {
  if (g.total == null) return `<div class="cheat-card__odds cheat-card__odds--none">O/U not posted</div>`;
  let deltaHtml = '';
  if (g.delta !== 0) {
    const cls = g.delta > 0 ? 'up' : 'down';
    const arrow = g.delta > 0 ? '↑' : '↓';
    const abs = Math.abs(g.delta).toFixed(1);
    deltaHtml = `<span class="cheat-card__odds-delta cheat-card__odds-delta--${cls}">${arrow} ${abs}</span>`;
  }
  return `<div class="cheat-card__odds">
    <span class="cheat-card__odds-total">O/U ${g.total}</span>
    <span class="cheat-card__odds-open">Opened ${g.opened}</span>
    ${deltaHtml}
  </div>`;
}

function renderCard(g) {
  const domeBadge = g.roof === 'dome' ? '<span class="cheat-card__badge cheat-card__badge--dome">Dome</span>'
                  : g.roof === 'retractable' ? '<span class="cheat-card__badge cheat-card__badge--roof">Roof</span>'
                  : '';
  const awayRank = g.away.rank ? `<span class="cheat-card__rank">#${g.away.rank}</span>` : '';
  const homeRank = g.home.rank ? `<span class="cheat-card__rank">#${g.home.rank}</span>` : '';
  const tempCls = g.tempClass ? ` wx-stat__primary--${g.tempClass}` : '';
  const precipCls = g.precip >= 70 ? 'precip-high' : g.precip >= 40 ? 'precip-mid' : 'precip-low';
  const windLabel = g.roof === 'dome' ? 'Indoor' : `<strong>${g.wind}</strong>&nbsp;mph ${windCompass(g.windDeg)}`;

  return `<a href="#" class="cheat-card" data-game-id="${g.id}"
             data-sort-kickoff="${g.date}T${String(g.kickoffMin).padStart(4,'0')}"
             data-sort-rain="${g.precip}"
             data-sort-wind="${g.wind}"
             data-sort-movement="${Math.abs(g.delta)}"
             data-sort-total="${g.total || 0}">
    <div class="cheat-card__rule">
      <span class="cheat-card__time">${g.kickoff}</span>
      <span class="cheat-card__rule-right">
        <span class="cheat-card__location">${g.venue.split(',').slice(-2).join(',').trim()}</span>
        ${domeBadge}
      </span>
    </div>
    <div class="cheat-card__teams">
      <div class="cheat-card__team">
        <span class="cheat-card__logo">${g.away.abbr.slice(0,3)}</span>
        <span>${awayRank}<span class="cheat-card__abbr">${g.away.abbr}</span></span>
      </div>
      <span class="cheat-card__at">at</span>
      <div class="cheat-card__team cheat-card__team--right">
        <span>${homeRank}<span class="cheat-card__abbr">${g.home.abbr}</span></span>
        <span class="cheat-card__logo">${g.home.abbr.slice(0,3)}</span>
      </div>
    </div>
    <div class="cheat-card__wx">
      <div class="wx-stat">
        <span class="wx-stat__primary${tempCls}">${g.temp}°</span>
      </div>
      <div class="wx-stat">
        <span class="wx-stat__primary">${g.roof === 'dome' ? '—' : `${g.wind}<span class="wx-stat__unit">mph</span>${g.gust && g.gust >= g.wind + 5 ? '<span class="wx-stat__gust-inline">G'+g.gust+'</span>' : ''}`}</span>
      </div>
      <div class="wx-stat">
        <span class="wx-stat__primary wx-stat__primary--${precipCls}">${g.precip}%</span>
      </div>
    </div>
    <div class="cheat-card__wx-detail">
      ${g.roof === 'dome'
        ? '<span class="wx-detail__item">Indoor</span><span class="wx-detail__item">—</span>'
        : `<span class="wx-detail__item">${stadiumIcon(g.windDeg, g.windClass)}&nbsp;${windCompass(g.windDeg)}</span>
           <span class="wx-detail__item">${precipIcon(g.precip)}</span>`}
    </div>
    ${renderOdds(g)}
  </a>`;
}

function render(sortKey) {
  const container = document.getElementById('games-container');
  let games = [...GAMES];

  // Group by date, then sort within each date group
  const byDate = {};
  for (const g of games) {
    if (!byDate[g.date]) byDate[g.date] = { label: g.dateLabel, games: [] };
    byDate[g.date].games.push(g);
  }

  const sortFns = {
    kickoff: (a, b) => a.kickoffMin - b.kickoffMin,
    rain: (a, b) => b.precip - a.precip,
    wind: (a, b) => b.wind - a.wind,
    movement: (a, b) => Math.abs(b.delta) - Math.abs(a.delta),
    total: (a, b) => (b.total || 0) - (a.total || 0),
  };

  for (const key in byDate) {
    byDate[key].games.sort(sortFns[sortKey]);
  }

  // Render date sections in chronological order
  const dates = Object.keys(byDate).sort();
  let html = '';
  for (const d of dates) {
    const section = byDate[d];
    html += `<div class="date-section">
      <div class="date-header">
        <h2 class="date-header__title">${section.label}</h2>
        <span class="date-header__count">${section.games.length} game${section.games.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="cheat-row">
        ${section.games.map(renderCard).join('')}
      </div>
    </div>`;
  }
  container.innerHTML = html;

  // Highlight the top card of each section when a non-default sort is active
  if (sortKey !== 'kickoff') {
    document.querySelectorAll('.date-section').forEach(sec => {
      const first = sec.querySelector('.cheat-card');
      if (first) first.classList.add('is-sort-highlighted');
    });
  }
}

// ============================================================================
// SORT UI
// ============================================================================
const trigger = document.getElementById('sortTrigger');
const menu = document.getElementById('sortMenu');
const label = document.getElementById('sortLabel');

trigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = menu.classList.toggle('is-open');
  trigger.setAttribute('aria-expanded', isOpen);
});

document.addEventListener('click', (e) => {
  if (!menu.contains(e.target) && e.target !== trigger) {
    menu.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
  }
});

menu.querySelectorAll('.sort-control__option').forEach(opt => {
  opt.addEventListener('click', () => {
    menu.querySelectorAll('.sort-control__option').forEach(o => o.setAttribute('aria-selected', 'false'));
    opt.setAttribute('aria-selected', 'true');
    label.textContent = opt.childNodes[0].textContent.trim();
    menu.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    render(opt.dataset.sort);
  });
});

// Initial render
render('kickoff');
document.getElementById('game-count').textContent = GAMES.length;
</script>

</body>
</html>
